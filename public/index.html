<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Architecture Diagram Builder — April2026</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo">◧</span>
        <div>
          <h1>Architecture Diagram Builder</h1>
          <input id="title" class="title-input" value="Falcon Reference Architecture" aria-label="Diagram title" />
        </div>
      </div>
      <div class="toolbar">
        <button id="btn-new" class="btn">New</button>
        <button id="btn-add-zone" class="btn">Add zone</button>
        <button id="btn-connect" class="btn" aria-pressed="false">Connect</button>
        <button id="btn-delete" class="btn btn-danger">Delete</button>
        <span class="divider"></span>
        <select id="load-select" class="select" aria-label="Load saved diagram">
          <option value="">Load saved…</option>
        </select>
        <button id="btn-save" class="btn btn-primary">Save</button>
        <span class="divider"></span>
        <button id="btn-export-mermaid" class="btn">Mermaid</button>
        <button id="btn-export-d2" class="btn">D2</button>
        <button id="btn-export-svg" class="btn">SVG</button>
        <button id="btn-export-png" class="btn">PNG</button>
      </div>
    </header>

    <main class="layout">
      <aside class="palette" id="palette" aria-label="Block palette">
        <div class="palette-hint">Click a block to add it</div>
      </aside>

      <section class="canvas-wrap">
        <div id="status" class="status" role="status"></div>
        <svg id="canvas" class="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
      </section>

      <aside class="inspector" aria-label="Inspector">
        <div id="inspector-empty" class="inspector-empty">Select a block or edge to edit its properties.</div>

        <div id="inspector-node" class="inspector-panel" hidden>
          <h2>Block</h2>
          <label>Label<input id="node-label" type="text" /></label>
          <label>Zone
            <select id="node-zone"></select>
          </label>
          <p id="node-type" class="muted"></p>
        </div>

        <div id="inspector-edge" class="inspector-panel" hidden>
          <h2>Connection</h2>
          <label>Label<input id="edge-label" type="text" /></label>
          <label>Style
            <select id="edge-style">
              <option value="solid">Solid</option>
              <option value="dashed">Dashed</option>
            </select>
          </label>
        </div>

        <div id="inspector-zone" class="inspector-panel" hidden>
          <h2>Zone</h2>
          <label>Label<input id="zone-label" type="text" /></label>
        </div>

        <div class="export-panel">
          <div class="export-head">
            <h2 id="export-title">Export</h2>
            <button id="btn-copy" class="btn btn-small" hidden>Copy</button>
          </div>
          <pre id="export-text" class="export-text" hidden></pre>
          <div id="export-preview" class="export-preview" hidden></div>
        </div>
      </aside>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
