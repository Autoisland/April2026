<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>April2026</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f172a;
        --card: #1e293b;
        --accent: #38bdf8;
        --text: #e2e8f0;
        --muted: #94a3b8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: radial-gradient(1200px 600px at 50% -10%, #1e293b, var(--bg));
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        background: var(--card);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 16px;
        padding: 32px;
        width: 100%;
        max-width: 520px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      }
      h1 { margin: 0 0 4px; font-size: 1.6rem; }
      p.sub { margin: 0 0 24px; color: var(--muted); }
      .row { display: flex; gap: 8px; margin-bottom: 20px; }
      input {
        flex: 1;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid rgba(148, 163, 184, 0.3);
        background: #0f172a;
        color: var(--text);
        font-size: 0.95rem;
      }
      button {
        padding: 10px 16px;
        border-radius: 10px;
        border: none;
        background: var(--accent);
        color: #04283a;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { filter: brightness(1.08); }
      ul { list-style: none; padding: 0; margin: 0; }
      li {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 10px;
        background: rgba(15, 23, 42, 0.6);
        margin-bottom: 8px;
      }
      li .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
      li.done .dot { background: #34d399; }
      li.done span.title { color: var(--muted); text-decoration: line-through; }
      .health { margin-top: 20px; font-size: 0.85rem; color: var(--muted); }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>April2026</h1>
      <p class="sub">Cloud Agent environment starter &mdash; tasks demo</p>
      <div class="row">
        <input id="title" type="text" placeholder="Add a task&hellip;" />
        <button id="add">Add</button>
      </div>
      <ul id="tasks"></ul>
      <div class="health" id="health">Checking API health&hellip;</div>
    </main>
    <script>
      async function loadTasks() {
        const res = await fetch("/api/tasks");
        const tasks = await res.json();
        const ul = document.getElementById("tasks");
        ul.innerHTML = "";
        for (const t of tasks) {
          const li = document.createElement("li");
          li.className = t.done ? "done" : "";
          li.innerHTML = `<span class="dot"></span><span class="title">${t.title}</span>`;
          ul.appendChild(li);
        }
      }
      async function addTask() {
        const input = document.getElementById("title");
        const title = input.value.trim();
        if (!title) return;
        await fetch("/api/tasks", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title }),
        });
        input.value = "";
        loadTasks();
      }
      async function checkHealth() {
        try {
          const res = await fetch("/api/health");
          const data = await res.json();
          document.getElementById("health").textContent =
            `API status: ${data.status} (uptime ${data.uptime.toFixed(1)}s)`;
        } catch (e) {
          document.getElementById("health").textContent = "API unreachable";
        }
      }
      document.getElementById("add").addEventListener("click", addTask);
      document.getElementById("title").addEventListener("keydown", (e) => {
        if (e.key === "Enter") addTask();
      });
      loadTasks();
      checkHealth();
    </script>
  </body>
</html>
